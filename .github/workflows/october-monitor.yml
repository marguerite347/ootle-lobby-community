# INTEGRATION_GAP[OPS-OCTOBER-CHANNEL] (retired): use the single consolidated daily owner automation.
name: Inspect contest submissions (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: submission-monitor-manual
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm run monitor:submissions -- --output work/submissions-monitor.json
      - name: Summarize public review queue
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,appendFileSync} from 'node:fs';
          const report=JSON.parse(readFileSync('work/submissions-monitor.json','utf8'));
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Submission sources checked: ${report.checkedAt}\n\n${report.summary.sourcesChecked} topics; ${report.summary.newPosts} new and ${report.summary.editedPosts} edited posts need review.\n\nDownload the report artifact and follow docs/DAILY_ECOSYSTEM_PLAN.md. This manual diagnostic does not publish; the consolidated owner automation handles daily curation and publication.\n`);
          JS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: submissions-report
          path: work/submissions-monitor.json*
          retention-days: 30
          if-no-files-found: error
