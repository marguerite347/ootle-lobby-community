name: Validate and publish
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: Validate content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: python3 -m unittest discover -s scripts -p 'test_source_evidence.py'
      - name: Validate bundled Python asset tools
        run: |
          python3 -m venv /tmp/ootle-asset-test-env
          /tmp/ootle-asset-test-env/bin/pip install --only-binary=:all: -r skills/vendor/gamedev/skills/disciplines/create-game-assets/scripts/requirements.txt
          /tmp/ootle-asset-test-env/bin/python scripts/test_asset_tools.py
      - run: npm audit --audit-level=low
      - run: npm run validate
      - run: npm --prefix creator-hub/capture ci --ignore-scripts
      - run: npm --prefix creator-hub/capture test
      - run: npm --prefix creator-hub/video-templates ci --ignore-scripts
      - run: npm --prefix creator-hub/video-templates test
      - run: npm --prefix creator-hub/video-templates run typecheck
      - run: npm --prefix creator-hub/video-templates audit --audit-level=low
  website:
    name: Validate website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run build:site
      - run: node scripts/check-wheel-runtime.mjs
      - run: npm --prefix creator-hub/hub audit --audit-level=low
      - run: npm --prefix creator-hub/hub/client test
      - run: node --test creator-hub/hub/server/test/communityContent.test.mjs creator-hub/hub/server/test/contestMetrics.test.mjs creator-hub/hub/server/test/communityProjectMetrics.test.mjs creator-hub/hub/server/test/projectChat.test.mjs creator-hub/hub/server/test/dailyTrivia*.test.mjs creator-hub/hub/server/test/workbench.test.mjs
      - name: Record exact build integrity
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lobby-integrity-${{ github.sha }}
          path: |
            public/build.json
            public/artifact-sha256.json
  publish:
    name: Publish accepted content
    needs: [validate, website]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: accepted-content
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      - name: Deploy accepted content
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
